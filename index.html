<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>For My Jaan ❤️</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:Georgia,serif}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;overflow:hidden;color:#4b2732;background:radial-gradient(circle at 50% 20%,#fff8fa 0,#f9dfe8 45%,#e9b8ca 100%)}
.scene{width:100%;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:22px}
.card{width:min(94vw,720px);padding:30px 22px 34px;text-align:center;border-radius:30px;background:rgba(255,255,255,.84);box-shadow:0 20px 70px rgba(91,38,58,.22);backdrop-filter:blur(12px)}
.date{font-size:13px;letter-spacing:3px;color:#9d6277}
h1{font-size:clamp(30px,8vw,54px);margin:10px 0 8px}.subtitle{font-size:17px;line-height:1.7;margin:0 auto 10px}
.cake-wrap{height:360px;display:flex;align-items:flex-end;justify-content:center;position:relative}
.cake{width:min(78vw,390px);height:205px;position:relative;margin-bottom:35px}
.plate{position:absolute;left:50%;bottom:-10px;transform:translateX(-50%);width:110%;height:25px;border-radius:50%;background:linear-gradient(#fff,#e7d7dc);box-shadow:0 9px 15px #0002}
.layer{position:absolute;left:50%;transform:translateX(-50%);width:100%;height:82px;border-radius:18px 18px 24px 24px;background:linear-gradient(90deg,#35170f,#63301d 35%,#4b2418 70%,#2e120c);box-shadow:inset 0 -12px 0 #29100b,0 10px 15px #0002}
.layer.bottom{bottom:8px}.layer.top{bottom:78px;height:76px;width:94%;border-radius:22px 22px 18px 18px}
.cream{position:absolute;left:50%;transform:translateX(-50%);bottom:68px;width:96%;height:30px;border-radius:50%;background:#fff0e7;box-shadow:0 4px 0 #e7c0b4}
.drip{position:absolute;top:11px;width:20px;height:30px;border-radius:0 0 15px 15px;background:#fff0e7}
.drip:nth-child(1){left:12%}.drip:nth-child(2){left:34%;height:40px}.drip:nth-child(3){left:62%;height:26px}.drip:nth-child(4){right:10%;height:37px}
.choc-drip{position:absolute;top:17px;left:50%;transform:translateX(-50%);width:92%;height:25px;background:#7b3e26;border-radius:50%}
.cherry{position:absolute;width:17px;height:17px;border-radius:50%;background:#8f1f2d;top:35px;box-shadow:inset 4px 3px 3px #ffffff33}
.cherry:nth-of-type(1){left:18%}.cherry:nth-of-type(2){left:47%}.cherry:nth-of-type(3){right:18%}
.candle{position:absolute;bottom:139px;width:18px;height:73px;border-radius:5px;background:repeating-linear-gradient(135deg,#f7c4d3 0 7px,#fff2f5 7px 14px);box-shadow:0 4px 7px #0002;z-index:5}
.candle:nth-of-type(1){left:31%}.candle:nth-of-type(2){left:calc(50% - 9px)}.candle:nth-of-type(3){right:31%}
.wick{position:absolute;top:-9px;left:50%;width:2px;height:11px;transform:translateX(-50%);background:#3a241f}
.flame{position:absolute;left:50%;top:-36px;width:17px;height:27px;transform:translateX(-50%);border-radius:50%;background:#ffd45c;box-shadow:0 0 18px 6px #ffb62e88,0 0 35px 10px #ff9e2d44;animation:flicker .7s infinite alternate ease-in-out}
.flame:after{content:"";position:absolute;left:5px;bottom:4px;width:7px;height:14px;border-radius:50%;background:#fff5bd}
.flame.off{animation:none;opacity:0;transform:translateX(-50%) scale(.1)}
@keyframes flicker{to{transform:translateX(-50%) scale(1.08) rotate(2deg)}}
.controls{margin-top:5px}
button{border:0;border-radius:999px;padding:14px 24px;font-size:16px;background:#b94d72;color:#fff;cursor:pointer;box-shadow:0 8px 22px #b94d7244}
button:disabled{opacity:.7;cursor:default}
#message{min-height:48px;margin:14px 0 0;font-size:16px;line-height:1.6}
.hidden{display:none}
#letter{margin-top:18px;text-align:left;line-height:1.8}.divider{height:1px;background:#efd2dc;margin:22px 0}
</style>
</head>
<body>
<div class="scene">
<main class="card">
<div class="date">14 • 10 • 2026</div>
<h1>Happy Birthday, Jaan 🎂</h1>
<p class="subtitle">A little chocolate cake made especially for you. ❤️</p>
<div class="cake-wrap">
<div class="cake">
<div class="candle"><div class="wick"></div><div class="flame"></div></div>
<div class="candle"><div class="wick"></div><div class="flame"></div></div>
<div class="candle"><div class="wick"></div><div class="flame"></div></div>
<div class="layer bottom"></div><div class="layer top"></div>
<div class="cream"><div class="drip"></div><div class="drip"></div><div class="drip"></div><div class="drip"></div></div>
<div class="choc-drip"></div><div class="cherry"></div><div class="cherry"></div><div class="cherry"></div><div class="plate"></div>
</div></div>
<div class="controls">
<button id="startBtn" onclick="startCandles()">Light the Candles 🕯️</button>
<p id="message">Make a wish, Jaan… ❤️</p>
</div>
<section id="letter" class="hidden">
<div class="divider"></div><h2 style="text-align:center">The candles are out. ✨</h2>
<p><strong>Happy 19th Birthday, My Jaan. ❤️</strong></p>
<p>May your life always be filled with happiness, peace, blessings and beautiful moments.</p>
<p style="text-align:center"><em>Keep smiling. Keep shining. 🎀</em></p>
</section>
</main></div>
<script>
let timer;
function startCandles(){
clearInterval(timer);
const flames=[...document.querySelectorAll('.flame')],btn=document.getElementById('startBtn'),msg=document.getElementById('message'),letter=document.getElementById('letter');
flames.forEach(f=>{f.classList.remove('off');f.style.opacity='1'});
letter.classList.add('hidden');btn.disabled=true;btn.textContent='The candles are burning… 🕯️';
const total=20000,start=Date.now();
timer=setInterval(()=>{
const remaining=Math.max(0,1-(Date.now()-start)/total);
flames.forEach(f=>{f.style.opacity=remaining;f.style.transform=`translateX(-50%) scale(${Math.max(.08,remaining)})`});
if(remaining<=0){
clearInterval(timer);flames.forEach(f=>f.classList.add('off'));
btn.disabled=false;btn.textContent='Light the Candles Again 🕯️';
msg.textContent='Your wish has been made… Happy Birthday, Jaan. ❤️';letter.classList.remove('hidden');
}else msg.textContent='Make your wish before the candles go out… ✨';
},100);
}
</script>
</body>
</html>
